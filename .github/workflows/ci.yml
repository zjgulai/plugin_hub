name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.11"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install API dependencies
        run: uv sync --directory apps/api --frozen --all-groups

      - name: Test API
        run: uv --directory apps/api run pytest

      - name: Lint API
        run: uv --directory apps/api run ruff check .

      - name: Typecheck API
        run: uv --directory apps/api run mypy

      - name: Build API package
        run: uv --directory apps/api build

  web-extension:
    name: Web and Extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Web and Extension
        run: pnpm -r test

      - name: Lint Web and Extension
        run: pnpm -r lint

      - name: Typecheck Web and Extension
        run: pnpm -r typecheck

      - name: Build Web and Extension
        run: pnpm -r build

      - name: Verify extension version governance
        run: pnpm test:extension-version && pnpm version:extension:check

      - name: Package and verify all extensions
        run: pnpm package:extension && pnpm verify:extension

  deployment-config:
    name: Deployment Config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLUGIN_HUB_API_READ_KEY: rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr
      PLUGIN_HUB_API_WRITE_KEY: wwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Validate deployment configuration
        run: |
          docker compose --env-file /dev/null \
            -f deploy/tencent-lighthouse/docker-compose.yml config --quiet
          zsh -n scripts/pull-offhost-backup.zsh
          python3 -m py_compile scripts/dry-run-insight-snapshot-migration.py
          git diff --check origin/main...HEAD
