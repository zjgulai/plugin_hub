    limit_req_zone $binary_remote_addr zone=plugin_hub_api:10m rate=10r/s;

    # HTTPS - plugin.lute-tlz-dddd.top (Plugin Hub VOC)
    server {
        listen 443 ssl;
        http2 on;
        server_name plugin.lute-tlz-dddd.top;

        ssl_certificate /etc/letsencrypt/live/plugin.lute-tlz-dddd.top/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/plugin.lute-tlz-dddd.top/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;

        location /api/ {
            client_max_body_size 8m;
            limit_req zone=plugin_hub_api burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://plugin-hub-api:8000/api/;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
        }

        location / {
            auth_basic "Plugin Hub Data Assets";
            auth_basic_user_file /etc/nginx/plugin-hub.htpasswd;
            proxy_pass http://plugin-hub-web:3000;
            include /etc/nginx/proxy_params.conf;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
